# Reproduit en local la topologie de production : un seul domaine (ici
# http://localhost:8080), /gestion/ servi par WordPress, tout le reste par
# le serveur de dev du front. Permet d'utiliser un chemin relatif
# (/gestion/wp-json/sierra/v1/...) pour l'API, identique en local et en
# production, sans variable d'environnement à changer (voir
# migration/DEPLOIEMENT.md - "zéro URL en dur").

server {
	listen 80;

	location /gestion/ {
		proxy_pass http://wordpress:80/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		proxy_pass http://front:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Nécessaire au rechargement à chaud (HMR) du serveur de dev Next.js.
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
}
